; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit docuhis mentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = BOARD_VIEWE_UEDX80480050E_WB_A

[env]
framework = arduino
monitor_speed = 115200
upload_port = COM11
monitor_port = COM11
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages = 
	platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
	platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
lib_deps = 
	https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
	https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
	https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
	https://github.com/lvgl/lvgl.git#v8.4.0
	
	bblanchon/ArduinoJson @ ^7.2.0

[common]
build_flags = 
	-DCORE_DEBUG_LEVEL=1
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-I src

[env:BOARD_VIEWE_UEDX80480050E_WB_A]
; ---------------------------------------------------------------------------
;  TRANSPORT SELECTION
;    -DLINK_WIFI present -> master/slave link runs over WiFi (UDP)
;    -DLINK_WIFI absent  -> master/slave link runs over the KQ-330 PLC modem
;  The protocol bytes are identical either way (see src/link.h).
;  Whichever you pick here, pick the SAME one in slave/platformio.ini.
; ---------------------------------------------------------------------------
build_flags =
	${common.build_flags}
	-DLV_COLOR_16_SWAP=0
	-DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
	-DBOARD_VIEWE_UEDX80480050E_WB_A
	-DLINK_WIFI
board = BOARD_VIEWE_UEDX80480050E_WB_A

