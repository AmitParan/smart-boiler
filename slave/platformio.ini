; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
; PINNED to the same proven ESP32 toolchain as the master (Arduino core 3.1.1).
; DO NOT revert to bare "platform = espressif32": the unpinned registry version
; (6.12.0) ships different ESP32-C6 UART support and breaks Serial1/PLC RX.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    https://github.com/PaulStoffregen/OneWire.git
    milesburton/DallasTemperature @ ^3.11.0
    bblanchon/ArduinoJson @ ^6.21.3