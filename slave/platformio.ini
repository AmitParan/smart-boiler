; ===========================================================================
;  WINDOWS COMMAND-LINE LENGTH FIX  —  DO NOT REMOVE
;
;  Windows CreateProcess() caps a command line at 32,767 characters.
;  RISC-V gcc forwards every -I include path to the assembler, and the
;  ESP32-C6 Arduino framework generates 278 of them (the C6 build pulls in
;  OpenThread, Zigbee and IEEE-802.15.4 headers on top of the usual ESP-IDF
;  set). Once the slave includes <WiFi.h> the assembler invocation reaches
;  32,870 characters — 103 over the limit — and the build dies with the very
;  misleading message:
;
;      riscv32-esp-elf-g++: fatal error: cannot execute '.../as.exe':
;      CreateProcess: No such file or directory
;
;  The assembler is fine. The command line is simply too long.
;
;  FIX: shorten every include path by moving the PlatformIO core directory
;  from  C:/Users/User/.platformio  (25 chars)  to  C:/pio  (6 chars).
;  274 paths x 19 chars = 5,206 characters saved -> ~27,660, safely under.
;
;  ONE-TIME SETUP on a new Windows machine (no admin rights needed):
;      mklink /J C:\pio %USERPROFILE%\.platformio
;  That makes C:/pio a junction to the existing PlatformIO folder, so
;  nothing is re-downloaded.
; ===========================================================================
[platformio]
core_dir = C:/pio

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
; PINNED to the same proven ESP32 toolchain as the master (Arduino core 3.1.1).
; DO NOT revert to bare "platform = espressif32": the unpinned registry version
; (6.12.0) ships different ESP32-C6 UART support and breaks Serial1/PLC RX.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    https://github.com/PaulStoffregen/OneWire.git
    milesburton/DallasTemperature @ ^3.11.0
    bblanchon/ArduinoJson @ ^6.21.3
upload_port = COM9
monitor_port = COM9

; ---------------------------------------------------------------------------
;  TRANSPORT SELECTION
;    -DLINK_WIFI present -> master/slave link runs over WiFi (UDP)
;    -DLINK_WIFI absent  -> master/slave link runs over the KQ-330 PLC modem
;  The protocol bytes are identical either way (see src/link.h).
;  Whichever you pick here, pick the SAME one in master/platformio.ini.
; ---------------------------------------------------------------------------
build_flags =
    -DLINK_WIFI
    ; src/ itself is on the include path automatically; its subfolders are not.
    ; These keep every #include short (e.g. "shared_data.h") after the move
    ; into folders, so no source file needed editing.
    -I src/config
    -I src/comms
    -I src/core
    -I src/tasks

; src/diagnostics/ holds standalone test sketches, each with its own
; setup()/loop(). They must stay out of the firmware build; to run one instead,
; swap this line for   build_src_filter = +<diagnostics/wifi_probe.cpp>
build_src_filter = +<*> -<diagnostics/>
